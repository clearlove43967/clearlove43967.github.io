<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · Jiantong Qin</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | escape }} · Jiantong Qin">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:image" content="{{ '/images/profile.png' | absolute_url }}">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#174c9c">
  <meta name="google-site-verification" content="xEeFjsGA7ZlML4C4NWQBdM9burUdRoNJkmIufarfn5s">
  <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
  <script src="{{ '/assets/js/academic.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Jiantong Qin — home"><span class="monogram" aria-hidden="true">JQ<span> .</span></span><span>Jiantong Qin</span></a>
    <nav aria-label="Main navigation">{% for item in site.data.navigation.main %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url or page.collection == 'publications' and item.url == '/publications/' %} aria-current="page"{% endif %}>{{ item.title }}{% if item.title == 'CV' %}<span aria-hidden="true"> ↗</span>{% endif %}</a>{% endfor %}</nav>
  </div></header>
  <main id="main" class="site-main" tabindex="-1">{{ content }}</main>
  <footer class="site-footer"><div><a class="footer-name" href="{{ '/' | relative_url }}">Jiantong Qin</a><span>Research, curiosity, and life in between.</span></div><p>© {{ 'now' | date: '%Y' }} Jiantong Qin · <a href="https://github.com/clearlove43967">GitHub</a> · <a href="mailto:{{ site.author.email }}">Email</a></p></footer>
</body>
</html>
